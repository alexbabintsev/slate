<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slate</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="current-project">
        <span id="current-icon"></span>
        <div id="current-info">
          <span id="current-label" data-i18n="currentProject">Current project</span>
          <span id="current-name" data-i18n="noProject">No Project</span>
          <span id="current-tabs"></span>
        </div>
      </div>
      <button id="btn-create-from-window" title="Create project from this window" data-i18n-title="createFromWindow" style="display:none"></button>
    </header>

    <div id="divider"></div>

    <div id="project-list">
      <div id="projects-container"></div>
    </div>

    <div id="review-banner" hidden>
      <p data-i18n="reviewPromptText">Enjoying Slate? A short review helps other people find it</p>
      <div class="review-actions">
        <button id="review-rate" class="review-btn primary" data-i18n="reviewPromptRate">Leave a review</button>
        <button id="review-later" class="review-btn" data-i18n="reviewPromptLater">Not now</button>
      </div>
    </div>

    <div id="footer">
      <button id="btn-new-project">
        <span id="btn-new-icon"></span>
        <span data-i18n="newProject">New Project</span>
      </button>
      <button id="open-manager" title="Manage projects" data-i18n-title="manageProjects"></button>
    </div>

    <div id="prompt-dialog" class="prompt-overlay" style="display:none">
      <div class="prompt-box">
        <div id="prompt-title" class="prompt-title" data-i18n="projectName">Project name</div>
        <input id="prompt-input" type="text" autocomplete="off" spellcheck="false">
        <div class="prompt-actions">
          <button id="prompt-cancel" class="prompt-btn" data-i18n="cancel">Cancel</button>
          <button id="prompt-ok" class="prompt-btn primary" data-i18n="ok">OK</button>
        </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
