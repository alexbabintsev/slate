name: Bug report
description: Something in Slate doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Slate version
      description: Shown at the bottom of the side panel, for example v1.1.0
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 156 on macOS
