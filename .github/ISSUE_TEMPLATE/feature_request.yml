name: Feature idea
description: Suggest something Slate should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation and what gets in your way today
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: Optional, a rough idea is plenty
